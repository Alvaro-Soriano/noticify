<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tests</title>
	<script src="/js/cards.js"></script>
	<link rel="stylesheet" href="/css/basic.css">
</head>

<body>
	<style>
		.statsCard{
			background-color: #b3d9ff;
			border: 2px solid #8cc6ff;
			color: #0053a6;
			padding: 5px;
			font-weight: bold;
			border-radius: 10px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 10px;
		}
		.purpleCard{
			background-color: #d2b3ff;
			border: 2px solid #ba8cff;
			color: #7c00a6;
		}
		.redCard{
			background-color: #ffb3b3;
			border: 2px solid #ff8c8c;
			color: #a6000e;
		}
		.statsCardTitle{
			font-size: 25px;
			text-align: center;
		}
		.statsCardValue{
			font-size: 40px;
			text-align: center;
		}
	</style>
	<header>
		<i class="fa-solid fa-bars menuOpenButton "></i>
		NOTICIFY
	</header>
	<aside>
		<nav>
			<a href="">
				<i class="fa-regular fa-house"></i>
				Home
			</a>
			<a href="">
				<i class="fa-solid fa-chart-line"></i>
				Dashboard
			</a>
		</nav>
	</aside>
	<main>
		<div class="notiCardCont">
			<notice-card
				data-title="00/000"
				data-type="NOTAM"
				data-zone="ZMA"
				data-startdate="10/10/2025 20:00"
				data-enddate="11/10/2025 20:00"
				data-status="A"
			></notice-card>
			<notice-card
				data-title="00/000"
				data-type="NOTAM"
				data-zone="ZMA"
				data-startdate="10/10/2025 20:00"
				data-enddate="11/10/2025 20:00"
				data-status="M"
			></notice-card>
			<notice-card
				data-title="00/000"
				data-type="NOTAM"
				data-zone="ZMA"
				data-startdate="10/10/2025 20:00"
				data-enddate="11/10/2025 20:00"
				data-status="C"
			></notice-card>
		</div>
		<div class="simpleScaleCont">
			<place-card data-icon="fa-plane-departure" data-label="Buscar por Aeropuertos"></place-card>
			<place-card data-icon="fa-user-astronaut" data-label="Buscar por Launch Pad"></place-card>
			<place-card data-icon="fa-rocket" data-label="Starship Watcher" href="https://google.com"></place-card>
		</div>
		<div class="simpleScaleCont">
			<div class="statsCard">
				<div class="statsCardTitle">Avisos Activos</div>
				<div class="statsCardValue">0</div>
			</div>
			<div class="statsCard purpleCard">
				<div class="statsCardTitle">Avisos Activos</div>
				<div class="statsCardValue">0</div>
			</div>
			<div class="statsCard redCard">
				<div class="statsCardTitle">Avisos Activos</div>
				<div class="statsCardValue">0</div>
			</div>
		</div>
	</main>



	<script src="/js/basic.js"></script>

</body>
</html>
