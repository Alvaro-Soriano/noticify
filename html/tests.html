<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tests</title>
	<script src="/js/cards.js"></script>
	<link rel="stylesheet" href="/css/basic.css">
</head>

<body>
	<header>
		<i class="fa-solid fa-bars menuOpenButton "></i>
		NOTICIFY
	</header>
	<aside>
		<nav>
			<a href="">
				<i class="fa-regular fa-house"></i>
				Home
			</a>
			<a href="">
				<i class="fa-solid fa-chart-line"></i>
				Dashboard
			</a>
		</nav>
	</aside>
	<main>
		<div style="display: grid;   grid-template-columns: repeat(auto-fit, minmax(min(370px, 100%), 1fr));gap:12px;">

			<notice-card
				data-title="00/000"
				data-type="NOTAM"
				data-zone="ZMA"
				data-startdate="10/10/2025 20:00"
				data-enddate="11/10/2025 20:00"
				data-status="A"
			></notice-card>
			<notice-card
				data-title="00/000"
				data-type="NOTAM"
				data-zone="ZMA"
				data-startdate="10/10/2025 20:00"
				data-enddate="11/10/2025 20:00"
				data-status="M"
			></notice-card>
			<notice-card
				data-title="00/000"
				data-type="NOTAM"
				data-zone="ZMA"
				data-startdate="10/10/2025 20:00"
				data-enddate="11/10/2025 20:00"
				data-status="C"
			></notice-card>
		</div>
		<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(370px, 1fr)); padding-top: 10px; gap:10px;">
			<place-card data-icon="fa-plane-departure" data-label="Buscar por Aeropuertos"></place-card>
			<place-card data-icon="fa-user-astronaut" data-label="Buscar por Launch Pad"></place-card>
			<place-card data-icon="fa-rocket" data-label="Starship Watcher" href="https://google.com"></place-card>
		</div>
	</main>

	<script src="/js/basic.js"></script>

</body>
</html>
