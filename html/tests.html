<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tests</title>
	<script src="/js/cards.js"></script>
	<link rel="stylesheet" href="/css/basic.css">
</head>

<body>
	<header>
		<i class="fa-solid fa-bars menuOpenButton "></i>
		NOTICIFY
	</header>
	<aside>
		<nav>
			<a href="">
				<i class="fa-regular fa-house"></i>
				Home
			</a>
			<a href="">
				<i class="fa-solid fa-chart-line"></i>
				Dashboard
			</a>
		</nav>
	</aside>
	<main>
		<div class="notiCardCont">
			<notice-card
				data-title="00/000"
				data-type="NOTAM"
				data-zone="ZMA"
				data-startdate="10/10/2025 20:00"
				data-enddate="11/10/2025 20:00"
				data-status="A"
			></notice-card>
			<notice-card
				data-title="00/000"
				data-type="NOTAM"
				data-zone="ZMA"
				data-startdate="10/10/2025 20:00"
				data-enddate="11/10/2025 20:00"
				data-status="M"
			></notice-card>
			<notice-card
				data-title="00/000"
				data-type="NOTAM"
				data-zone="ZMA"
				data-startdate="10/10/2025 20:00"
				data-enddate="11/10/2025 20:00"
				data-status="C"
			></notice-card>
		</div>
		<div class="simpleScaleCont">
			<place-card data-icon="fa-plane-departure" data-label="Buscar por Aeropuertos"></place-card>
			<place-card data-icon="fa-user-astronaut" data-label="Buscar por Launch Pad"></place-card>
			<place-card data-icon="fa-rocket" data-label="Starship Watcher" href="https://google.com"></place-card>
		</div>
		<div class="simpleScaleCont">

			<stats-card data-title="Avisos Activos" data-value="0" data-status="A"></stats-card>
			<stats-card data-title="Avisos Activos" data-value="0" data-status="M"></stats-card>
			<stats-card data-title="Avisos Activos" data-value="0" data-status="C"></stats-card>
			<stats-card data-title="Avisos Activos" data-value="0"></stats-card>
		</div>

		<div style="padding-top: 10px; width: 100%; display: flex; gap: 10px;">
			<input type="text" value="TEST">
			<select name="" id="">
				<option value="1">TEST 1</option>
				<option value="2">TEST 2</option>
			</select>
		</div>
		<div style="padding-top: 10px; width: 100%; display: flex; gap: 10px;">
			<button class="blueButton"><i class="fa-regular fa-floppy-disk"></i>Guardar</button>
			<button class="purpleButton"><i class="fa-solid fa-pencil"></i>Editar</button>
			<button class="redButton"><i class="fa-regular fa-trash-can"></i>Eliminar</button>
			<button>Cancelar</button>
		</div>
	</main>



	<script src="/js/basic.js"></script>

</body>
</html>
