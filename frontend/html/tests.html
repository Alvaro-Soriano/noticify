<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tests</title>
	<script src="../js/cards.js"></script>
	<link rel="stylesheet" href="../css/basic.css">
</head>

<body>
	<header>
		<i class="fa-solid fa-bars menuOpenButton "></i>
		NOTICIFY
	</header>
	<aside>
		<nav>
			<a href="">
				<i class="fa-regular fa-house"></i>
				Home
			</a>
			<a href="">
				<i class="fa-solid fa-magnifying-glass"></i>
				Búsqueda libre
			</a>
			<a href="">
				<i class="fa-solid fa-chart-line"></i>
				Dashboard
			</a>
		</nav>
	</aside>
	<main>
		<div class="notiCardCont">
			<notice-card
				data-title="00/000"
				data-type="NOTAM"
				data-zone="ZMA"
				data-startdate="10/10/2025 20:00"
				data-enddate="11/10/2025 20:00"
				data-status="A"
			></notice-card>
			<notice-card
				data-title="00/000"
				data-type="NOTAM"
				data-zone="ZMA"
				data-startdate="10/10/2025 20:00"
				data-enddate="11/10/2025 20:00"
				data-status="M"
			></notice-card>
			<notice-card
				data-title="00/000"
				data-type="NOTAM"
				data-zone="ZMA"
				data-startdate="10/10/2025 20:00"
				data-enddate="11/10/2025 20:00"
				data-status="C"
			></notice-card>
		</div>
		<div class="simpleScaleCont">
			<place-card data-icon="fa-plane-departure" data-label="Buscar por Zonas aereas"></place-card>
			<place-card data-icon="fa-user-astronaut" data-label="Buscar por Launch Pad"></place-card>
			<place-card data-icon="fa-rocket" data-label="Starship Watcher" href="https://google.com"></place-card>
		</div>
		<div class="simpleScaleCont">

			<stats-card data-title="Avisos Activos" data-value="0" data-status="A"></stats-card>
			<stats-card data-title="Avisos Activos" data-value="0" data-status="M"></stats-card>
			<stats-card data-title="Avisos Activos" data-value="0" data-status="C"></stats-card>
			<stats-card data-title="Avisos Activos" data-value="0"></stats-card>
		</div>

		<div style="padding-top: 10px; width: 100%; display: flex; gap: 10px;">
			<input type="text" value="TEST">
			<select name="" id="">
				<option value="1">TEST 1</option>
				<option value="2">TEST 2</option>
			</select>
		</div>
		<div style="padding-top: 10px; width: 100%; display: flex; gap: 10px;">
			<button class="blueButton"><i class="fa-regular fa-floppy-disk"></i>Guardar</button>
			<button class="purpleButton"><i class="fa-solid fa-pencil"></i>Editar</button>
			<button class="redButton"><i class="fa-regular fa-trash-can"></i>Eliminar</button>
			<button>Cancelar</button>
		</div>
		<style>
			.airzoneCard{
				padding: 10px;
				background-color: white;
				color: hsl(100 0% 20%);
				display: flex;
				gap: 10px;
				min-height: 60px;
			}
			.airzoneFlag {
				width: 70px;
				background-color: hsl(0, 0%, 93%);
				border-radius: 5px;
				display: flex;
				justify-content: center;
				align-items: center;
			}
			.airzoneFlag > img{
				width: 50px;
			}
			
			.airzoneSideContent{
				display: flex;
				flex-direction: column;
				gap: 5px;
			}
			.airzoneTitle{
				display: flex;
				align-items: center;
				gap: 10px;
				font-weight: 600;
				font-size: 20px;
			}
			
	
			.airzoneDetails{
				display: flex;
				gap: 5px;
			}
			.airzoneDetailsBubble{
				background-color: #8dbbec;
				color: #102441;
				font-weight: 600;
				border-radius: 8px;
				font-size: 13px;
				padding: 5px;
			}

		</style>

		<div class="airzoneCard">
			<div class="airzoneFlag">
				<img src="../imgs/flags/ES.svg" alt="">
			</div>

			<div class="airzoneSideContent">
				<div class="airzoneTitle">
					<span>Madrid</span>
				</div>
				<div class="airzoneDetails">
					<span class="airzoneDetailsBubble">LECM</span>
				</div>
			</div>
		

		</div>
	</main>



	<script src="../js/basic.js"></script>

</body>
</html>
