<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tests</title>
	<script src="./cards.js"></script>
</head>
<style>
	@import url('https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap');
	@import url("https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css");
	@import url("https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css");

	*{
		font-family: "Sora", sans-serif;
		font-optical-sizing: auto;
		font-style: normal;

	}
	html,body{
		padding: 0 !important;
		margin: 0 !important;

	}
	body{
		background-color: hsl(0 0 95);
	}
	.placeCard{
		display: flex;
		border-radius: 10px;
		font-family: "Sora", sans-serif;
		font-optical-sizing: auto;
		font-style: normal;
	}

	.placeCardText{
			border: 2px solid hsl(0 0% 85%);
			background-color: white;
			width: 100%;
			border-radius: 10px;
			padding: 4px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			gap: 2px;
			min-width: 0;
			border-left: none;
			border-top-left-radius: 0px;
			border-bottom-left-radius: 0px;
			font-size: 21px;
			color: hsl(100 0% 20%);
			font-weight: 500;
	}
	.placeCardIcon{
		font-size: 30px;
		padding: 10px;
		display: flex;
		justify-content: center;
		align-items: center;
		color:white;
		background-color: #1d6ebf;
		border-top-left-radius: 10px;
		border-bottom-left-radius: 10px;
	}


</style>
<body>
	<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(370px, 1fr)); padding: 10px; gap:12px;">

		<notice-card
			data-title="00/000"
			data-type="NOTAM"
			data-zone="ZMA"
			data-startdate="10/10/2025 20:00"
			data-enddate="11/10/2025 20:00"
			data-status="A"
		></notice-card>
		<notice-card
			data-title="00/000"
			data-type="NOTAM"
			data-zone="ZMA"
			data-startdate="10/10/2025 20:00"
			data-enddate="11/10/2025 20:00"
			data-status="M"
		></notice-card>
		<notice-card
			data-title="00/000"
			data-type="NOTAM"
			data-zone="ZMA"
			data-startdate="10/10/2025 20:00"
			data-enddate="11/10/2025 20:00"
			data-status="C"
		></notice-card>
	</div>
	<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(370px, 1fr)); padding:10px; gap:10px;">
		<place-card data-icon="fa-plane-departure" data-label="Buscar por Aeropuertos"></place-card>
		<place-card data-icon="fa-user-astronaut" data-label="Buscar por Launch Pad"></place-card>
		<place-card data-icon="fa-rocket" data-label="Starship Watcher" href="https://google.com"></place-card>
		
	</div>

	
</body>
</html>
